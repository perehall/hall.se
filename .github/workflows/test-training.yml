name: Test training app

on:
  pull_request:
    paths:
      - "träning/**"
      - "infra/strava-webhook/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"
  push:
    branches:
      - main
    paths:
      - "träning/scripts/**"
      - "träning/tests/**"
      - "träning/coach_prompt.md"
      - "träning/week_review_prompt.md"
      - "träning/data/plan.json"
      - "träning/data/upcoming_week.json"
      - "träning/data/goal.json"
      - "träning/data/training_strategy.json"
      - "träning/data/activity_overrides.json"
      - "träning/data/sport_icons.json"
      - "träning/data/settings.json"
      - "träning/data/weather_config.json"
      - "infra/strava-webhook/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"

concurrency:
  group: test-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q "träning/scripts" "träning/tests"

      - name: Unit and regression tests
        run: python -m unittest discover -s "träning/tests" -p "test_*.py" -v

      - name: Test Strava webhook worker
        run: |
          node --check "infra/strava-webhook/src/worker.mjs"
          node --test "infra/strava-webhook/test/worker.test.mjs"

      - name: Offline site-generation smoke test
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/render_training_site.py"
          test -s "träning/index.html"
          grep -Fq '<section class="dashboard"' "träning/index.html"
          grep -Fq '<section class="training-brain"' "träning/index.html"
          grep -Fq 'Nästa beslut' "träning/index.html"
          grep -Fq 'week-focus-block-meta' "träning/index.html"
          grep -Fq 'class="week-status-expander"' "träning/index.html"
          grep -Fq '<summary>Veckostatus · ' "träning/index.html"
          grep -Fq 'Garmin via Intervals.icu används som privat återhämtningskontext' "träning/index.html"
          grep -Fq 'Väderprognos:' "träning/index.html"
          grep -Fq '>SMHI</a>' "träning/index.html"
          ! grep -Fq 'Prioritering just nu:' "träning/index.html"

      - name: Diff hygiene
        run: git diff --check
