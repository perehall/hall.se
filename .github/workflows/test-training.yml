name: Test training app

on:
  pull_request:
    paths:
      - "träning/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"
  push:
    branches:
      - main
    paths:
      - "träning/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q "träning/scripts" "träning/tests"

      - name: Unit and regression tests
        run: python -m unittest discover -s "träning/tests" -p "test_*.py" -v

      - name: Offline site-generation smoke test
        run: |
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/build.py"
          python "träning/scripts/finalize_dashboard.py"
          python "träning/scripts/finalize_dashboard_ui.py"
          python "träning/scripts/finalize_activity_labels.py"
          python "träning/scripts/finalize_yoda_ui.py"
          python "träning/scripts/archive_weeks.py"
          python "träning/scripts/build_upcoming_week.py"
          python "träning/scripts/finalize_header_ui.py"
          python "träning/scripts/finalize_navigation_ui.py"
          python "träning/scripts/finalize_sport_icons.py"
          python "träning/scripts/finalize_day_session_icons.py"
          python "träning/scripts/finalize_workout_history.py"
          python "träning/scripts/build_home.py"
          python "träning/scripts/finalize_goal_link_layout.py"
          python "träning/scripts/publish_goal_cache_bypass.py"
          python "träning/scripts/validate_site_contracts.py"
          grep -Fq '<strong>Löpning · grus/asfalt</strong>' "träning/index.html"

      - name: Diff hygiene
        run: git diff --check
