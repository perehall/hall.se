name: Test training app

on:
  pull_request:
    paths:
      - "träning/**"
      - "infra/strava-webhook/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/update-training.yml"
      - ".github/workflows/refresh-training-day.yml"

concurrency:
  group: test-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression suite
        run: python "träning/scripts/run_regression_tests.py"

      - name: Test Strava webhook worker
        run: |
          node --check "infra/strava-webhook/src/worker.mjs"
          node --test "infra/strava-webhook/test/worker.test.mjs"

      - name: Offline site-generation smoke test
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py" --allow-stale-goal
          python "träning/scripts/build_athlete_state.py"
          python "träning/scripts/adaptive_planner.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/rollover_week.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/materialize_workout_designs.py"
          python "träning/scripts/validate_workout_designs.py"
          python "träning/scripts/materialize_device_workouts.py"
          python "träning/scripts/validate_device_workouts.py"
          python "träning/scripts/render_training_site.py"
          test -s "träning/index.html"
          grep -Fq '<section class="dashboard"' "träning/index.html"
          grep -Fq 'class="top-overview"' "träning/index.html"
          grep -Fq 'class="top-today"' "träning/index.html"
          grep -Fq 'class="top-next"' "träning/index.html"
          grep -Eq 'class="[^"]*current-week-header[^"]*"' "träning/index.html"
          grep -Eq 'class="[^"]*current-week-focus[^"]*"' "träning/index.html"
          grep -Eq 'class="[^"]*current-week-meta[^"]*"' "träning/index.html"
          grep -Eq 'class="[^"]*week-context-header[^"]*"' "träning/index.html"
          ! grep -Fq 'class="top-week-focus"' "träning/index.html"
          grep -Fq 'mikrocykel' "träning/index.html"
          ! grep -Fq 'class="training-brain"' "träning/index.html"
          ! grep -Fq 'class="hero week-focus-card"' "träning/index.html"
          grep -Fq 'Kalendervecka:' "träning/index.html"
          grep -Fq 'class="week-status-expander"' "träning/index.html"
          grep -Fq 'träningsdagar' "träning/index.html"
          grep -Fq 'Garmin via Intervals.icu används som privat återhämtningskontext' "träning/index.html"
          grep -Fq 'Väderprognos:' "träning/index.html"
          grep -Fq '>SMHI</a>' "träning/index.html"
          grep -Fq 'Passupplägg' "träning/index.html"
          grep -Fq 'workout-card-v2' "träning/index.html"
          grep -Fq 'class="card-v2-footer"' "träning/index.html"
          grep -Eq 'Klocksync (väntar|skickad|fel)' "träning/index.html"
          grep -Fq 'quiet-performance-v1:start' "träning/index.html"
          grep -Fq 'quiet-performance-v2:start' "träning/index.html"
          grep -Fq 'training-timeline-v1:start' "träning/index.html"
          grep -Fq 'class="week-timeline"' "träning/index.html"
          ! grep -Fq 'class="timeline-scroll-context"' "träning/index.html"
          ! grep -Fq 'training-timeline-js-v1:start' "träning/index.html"
          grep -Fq 'class="top-week-nav"' "träning/index.html"
          grep -Fq 'background:transparent!important;' "träning/index.html"
          grep -Fq 'content="#F6F7F5"' "träning/index.html"
          grep -Fq 'quiet-performance qp-current' "träning/index.html"
          ! grep -Fq '<div class="dashboard-title">Kommande dagar</div>' "träning/index.html"
          ! grep -Fq 'Prioritering just nu:' "träning/index.html"

      - name: Diff hygiene
        run: git diff --check
