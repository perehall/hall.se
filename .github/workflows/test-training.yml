name: Test training app

on:
  pull_request:
    paths:
      - "träning/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"
  push:
    branches:
      - main
    paths:
      - "träning/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/update-training.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q "träning/scripts" "träning/tests"

      - name: Unit and regression tests
        run: python -m unittest discover -s "träning/tests" -p "test_*.py" -v

      - name: Offline site-generation smoke test
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/render_training_site.py"
          grep -Fq '<strong>Löpning · grus/asfalt</strong>' "träning/index.html"

      - name: Diff hygiene
        run: git diff --check
