name: Test training app

on:
  pull_request:
    paths:
      - "träning/**"
      - "infra/strava-webhook/**"
      - ".github/workflows/test-training.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/update-training.yml"
      - ".github/workflows/refresh-training-day.yml"

concurrency:
  group: test-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression suite
        run: python "träning/scripts/run_regression_tests.py"

      - name: Test Strava webhook worker
        run: |
          node --check "infra/strava-webhook/src/worker.mjs"
          node --test "infra/strava-webhook/test/worker.test.mjs"

      - name: Offline site-generation smoke test
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py" --allow-stale-goal
          python "träning/scripts/build_athlete_state.py"
          python "träning/scripts/adaptive_planner.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/rollover_week.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/materialize_workout_designs.py"
          python "träning/scripts/validate_workout_designs.py"
          python "träning/scripts/materialize_device_workouts.py"
          python "träning/scripts/validate_device_workouts.py"
          python "träning/scripts/render_training_site.py"
          test -s "träning/index.html"
          grep -Fq '<!doctype html>' "träning/index.html"
          grep -Fq 'class="v2-shell"' "träning/index.html"
          grep -Fq 'class="v2-today"' "träning/index.html"
          grep -Fq 'class="v2-week"' "träning/index.html"
          grep -Fq 'class="v2-week-context"' "träning/index.html"
          grep -Fq 'class="v2-week-status"' "träning/index.html"
          grep -Fq 'data-v2-goal-link' "träning/index.html"
          grep -Fq 'Målbild 2027' "träning/index.html"
          grep -Fq 'Styrkemall' "träning/index.html"
          grep -Fq 'Om systemet' "träning/index.html"
          grep -Fq 'Väderprognos:' "träning/index.html"
          grep -Fq '>SMHI</a>' "träning/index.html"
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("träning/index.html").read_text(encoding="utf-8")
          states=re.findall(r'data-device-sync="(pending|synced|error)"', html)
          labels=re.findall(r'Klocksync (väntar|skickad|fel)', html)
          if states and len(states) != len(labels):
              raise SystemExit("V2 device-sync smoke: status saknar giltig publik etikett")
          if "quiet-performance-v1:start" in html or "card-v2-footer" in html:
              raise SystemExit("Legacy presentation layer leaked into v2 publication")
          print(f"V2_PUBLICATION_SMOKE_OK device_sync_visible={len(states)}")
          PY

      - name: Diff hygiene
        run: git diff --check
