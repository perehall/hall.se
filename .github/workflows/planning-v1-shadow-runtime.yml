name: Planning v1 shadow after training update

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update training data"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: planning-v1-shadow-runtime
  cancel-in-progress: false

jobs:
  shadow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run current-microcycle shadow solve
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$SUPABASE_DB_URL"
          read -r PLANNING_DATE AFFECTED_FROM AFFECTED_UNTIL FUTURE_CONTEXT WEEK_KEY <<EOF
          $(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Europe/Stockholm")).date()
          start = today - timedelta(days=today.weekday())
          end = start + timedelta(days=6)
          future = end + timedelta(days=3)
          iso = start.isocalendar()
          print(today.isoformat(), start.isoformat(), end.isoformat(), future.isoformat(), f"{iso.year}-W{iso.week:02d}")
          PY
          )
          EOF

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            event_key="training-update:${SOURCE_RUN_ID}:current"
            trigger_source="canonical_training_update_shadow"
          else
            event_key="manual:${GITHUB_RUN_ID}:current"
            trigger_source="manual_shadow_probe"
          fi

          PYTHONPATH="träning" python "träning/scripts/planning_v1_shadow_run.py"             --planning-date "$PLANNING_DATE"             --affected-from "$AFFECTED_FROM"             --affected-until "$AFFECTED_UNTIL"             --future-context-through "$FUTURE_CONTEXT"             --event-key "$event_key"             --trigger-source "$trigger_source"             --microcycle-key "$WEEK_KEY"             --audit-if-available

      - name: Run next-microcycle scenario shadow
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$SUPABASE_DB_URL"
          read -r PLANNING_DATE AFFECTED_FROM AFFECTED_UNTIL FUTURE_CONTEXT WEEK_KEY <<EOF
          $(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("Europe/Stockholm")).date()
          current_start = today - timedelta(days=today.weekday())
          start = current_start + timedelta(days=7)
          end = start + timedelta(days=6)
          future = end + timedelta(days=3)
          iso = start.isocalendar()
          print(today.isoformat(), start.isoformat(), end.isoformat(), future.isoformat(), f"{iso.year}-W{iso.week:02d}")
          PY
          )
          EOF

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            event_key="training-update:${SOURCE_RUN_ID}:next"
          else
            event_key="manual:${GITHUB_RUN_ID}:next"
          fi

          PYTHONPATH="träning" python "träning/scripts/planning_v1_shadow_run.py"             --planning-date "$PLANNING_DATE"             --affected-from "$AFFECTED_FROM"             --affected-until "$AFFECTED_UNTIL"             --future-context-through "$FUTURE_CONTEXT"             --event-key "$event_key"             --trigger-source "canonical_training_update_shadow_next"             --microcycle-key "$WEEK_KEY"             --audit-if-available

      - name: Report accumulated shadow evidence
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          PYTHONPATH="träning" python "träning/scripts/planning_v1_shadow_evidence.py"
