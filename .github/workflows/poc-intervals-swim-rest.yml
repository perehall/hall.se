name: POC Intervals swim REST semantics

on:
  workflow_dispatch:
  push:
    paths:
      - "träning/data/intervals-swim-rest-poc-trigger.txt"

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create and inspect minimal swim REST workout
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python "träning/scripts/poc_intervals_swim_rest.py"
