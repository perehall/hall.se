name: Update training data

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - strava-activity-event
      - training-input-event
  schedule:
    # Safety reconcile behålls tills Strava-webhooken är verifierad end-to-end.
    # Veckorullning sker redan i den kanoniska pipelinen och den separata
    # midnight-workflowen dispatchar samma pipeline en gång per lokal dag.
    - cron: "17 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "träning/data/manual-sync-trigger.txt"
      - "träning/data/goal.json"
      - "träning/data/planning_policy.json"
      - "träning/data/workout_catalog.json"
      - "träning/data/activity_directives.json"
      - "träning/scripts/apply_activity_directives.py"
      - "träning/scripts/adaptive_planner.py"
      - "träning/scripts/supabase_goal_source.py"
      - "träning/scripts/supabase_activity_backend.py"
      - "träning/scripts/supabase_runtime_state.py"
      - "träning/scripts/race_contracts.py"
      - "träning/scripts/goal_contracts.py"
      - "träning/scripts/build_athlete_state.py"
      - "träning/scripts/rollover_week.py"
      - "träning/scripts/workout_design.py"
      - "träning/scripts/training_job_runner.py"
      - "träning/scripts/training_input.py"
      - "träning/scripts/finalize_training_input_ui.py"

concurrency:
  group: training-pages
  queue: max

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression suite
        run: python "träning/scripts/run_regression_tests.py"

  update:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # repository_dispatch freezes github.sha when the webhook event is created.
      # A queued writer must instead start from main as it exists when the writer
      # actually gets the serialized training-pages slot.
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin writable base to latest main
        id: training_base
        run: |
          git fetch origin main --depth=1
          git checkout -B main origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Training writer base: $(git rev-parse --short HEAD)"

      - name: Backup current live page once
        run: |
          if [ ! -f "träning/index.manual-backup.html" ]; then
            cp "träning/index.html" "träning/index.manual-backup.html"
          fi

      - name: Install Supabase backend dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run canonical training update pipeline
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: /tmp/strava_refresh_token
          STRAVA_WEBHOOK_OBJECT_TYPE: ${{ github.event.client_payload.object_type }}
          STRAVA_WEBHOOK_OBJECT_ID: ${{ github.event.client_payload.object_id }}
          STRAVA_WEBHOOK_ASPECT_TYPE: ${{ github.event.client_payload.aspect_type }}
          STRAVA_WEBHOOK_EVENT_TIME: ${{ github.event.client_payload.event_time }}
          STRAVA_WEBHOOK_EVENT_KEY: ${{ github.event.client_payload.event_key }}
          GH_TOKEN: ${{ secrets.TRAINING_SECRET_PAT }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WELLNESS_CONTEXT_FILE: /tmp/training_wellness_context.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          OPENAI_MODEL: gpt-5-mini
          TRAINING_INPUT_MODEL: gpt-5-mini
          TRAINING_INPUT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          TRAINING_INPUT_EVENT: ${{ github.event.action == 'training-input-event' && 'true' || 'false' }}
        run: |
          if [ "${{ github.event.action }}" = "strava-activity-event" ]; then
            ingest_mode=event
          else
            ingest_mode=reconcile
          fi
          python "träning/scripts/training_job_runner.py" --ingest-mode "$ingest_mode"

      - name: Commit synced data, coach state and live page
        id: commit_changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TRACKED=(
            "träning/data/activities.json"
            "träning/data/performance_history.json"
            "träning/data/athlete_state.json"
            "träning/data/mesocycle_decision.json"
            "träning/data/microcycle_decision.json"
            "träning/data/decision_log.json"
            "träning/data/activity_overrides.json"
            "träning/data/coach.json"
            "träning/data/plan.json"
            "träning/data/upcoming_week.json"
            "träning/data/training_strategy.json"
            "träning/data/goal.json"
            "träning/data/weather.json"
            "träning/data/dashboard_summary.json"
            "träning/data/week_reviews"
            "träning/data/weeks"
            "träning/vecka"
            "träning/malbild"
            "träning/malbild-2027"
            "träning/index.html"
            "träning/index.manual-backup.html"
          )
          if [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes."
          else
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- "${TRACKED[@]}"
            git commit -m "Auto-update training page and AI coach"

            # Generated JSON/HTML files are complete snapshots. They must never be
            # rebased/merged with a newer generated snapshot. The shared concurrency
            # group should keep this stable; this guard fails closed if another writer
            # nevertheless moves main while the pipeline is running.
            BASE_SHA="${{ steps.training_base.outputs.sha }}"
            REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
              echo "::notice::main moved from $BASE_SHA to $REMOTE_SHA while the training pipeline was running. Discarding this generated snapshot and queueing one clean retry from current main."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "retry=true" >> "$GITHUB_OUTPUT"
              gh workflow run update-training.yml --ref main
              exit 0
            fi

            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical Pages deployment
        if: steps.commit_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          echo "Generated training commit published through the canonical Pages workflow_dispatch."

      - name: Confirm clean retry queued
        if: steps.commit_changes.outputs.retry == 'true'
        run: echo "Training update superseded by a newer main commit; a fresh serialized retry has been queued."

      - name: Confirm no deployment needed
        if: steps.commit_changes.outputs.changed != 'true' && steps.commit_changes.outputs.retry != 'true'
        run: echo "Training update complete; site content was unchanged, so no Pages deployment is needed."


  shadow_sync:
    name: Supabase shadow sync (non-blocking)
    needs: update
    if: ${{ needs.update.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Sync canonical state to Supabase shadow
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Supabase shadow sync + readback attempt $attempt/3"
            python "träning/scripts/supabase_shadow_writer.py" --mode write
            status=$?
            if [ "$status" -eq 0 ]; then
              python "träning/scripts/supabase_shadow_reader.py"
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo "Supabase shadow sync and independent readback completed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::warning::Supabase shadow sync/readback failed after 3 attempts. Canonical training update and site publication remain valid; shadow state will retry on the next training run."
          exit 1
