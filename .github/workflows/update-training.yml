name: Update training data (manual test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Strava
        id: strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python "träning/scripts/sync_strava.py"

      - name: Persist rotated Strava refresh token
        if: ${{ steps.strava.outputs.refresh_token != '' && secrets.TRAINING_SECRET_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.TRAINING_SECRET_PAT }}
          NEW_REFRESH_TOKEN: ${{ steps.strava.outputs.refresh_token }}
        run: printf '%s' "$NEW_REFRESH_TOKEN" | gh secret set STRAVA_REFRESH_TOKEN --body -

      - name: Build preview page
        run: python "träning/scripts/build.py"

      - name: Commit synced data and preview
        run: |
          if git diff --quiet -- "träning/data/activities.json" "träning/index.generated.html"; then
            echo "No changes."
            exit 0
          fi
          git config user.name "training-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "träning/data/activities.json" "träning/index.generated.html"
          git commit -m "Auto-sync training data"
          git push
