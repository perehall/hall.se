name: Update training data

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - strava-activity-event
  schedule:
    # Safety reconcile behålls tills Strava-webhooken är verifierad end-to-end.
    - cron: "17 */3 * * *"
    # Veckorullning 00:05 Europe/Stockholm. Två UTC-tider täcker CET/CEST;
    # rollover_week.py använder lokal kalendervecka och är idempotent.
    - cron: "5 22 * * 0"
    - cron: "5 23 * * 0"
  push:
    paths:
      - "träning/data/manual-sync-trigger.txt"

concurrency:
  group: training-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression tests
        run: |
          python -m compileall -q "träning/scripts" "träning/tests"
          python -m unittest discover -s "träning/tests" -p "test_*.py" -v

      - name: Backup current live page once
        run: |
          if [ ! -f "träning/index.manual-backup.html" ]; then
            cp "träning/index.html" "träning/index.manual-backup.html"
          fi

      - name: Sync Strava webhook event
        if: github.event_name == 'repository_dispatch'
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: /tmp/strava_refresh_token
          STRAVA_WEBHOOK_OBJECT_TYPE: ${{ github.event.client_payload.object_type }}
          STRAVA_WEBHOOK_OBJECT_ID: ${{ github.event.client_payload.object_id }}
          STRAVA_WEBHOOK_ASPECT_TYPE: ${{ github.event.client_payload.aspect_type }}
          STRAVA_WEBHOOK_EVENT_TIME: ${{ github.event.client_payload.event_time }}
          STRAVA_WEBHOOK_EVENT_KEY: ${{ github.event.client_payload.event_key }}
        run: python "träning/scripts/sync_strava_event.py"

      - name: Sync Strava safety reconcile
        if: github.event_name != 'repository_dispatch'
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: /tmp/strava_refresh_token
        run: python "träning/scripts/sync_strava.py"

      - name: Normalize activity semantics
        run: python "träning/scripts/normalize_activity_semantics.py"

      - name: Migrate typed plan data
        run: python "träning/scripts/migrate_training_data_v3.py"

      - name: Validate normalized training data
        run: python "träning/scripts/validate_training_data.py"

      - name: Roll over calendar week
        run: python "träning/scripts/rollover_week.py"

      - name: Validate rolled-over training data
        run: python "träning/scripts/validate_training_data.py"

      - name: Persist rotated Strava refresh token
        env:
          GH_TOKEN: ${{ secrets.TRAINING_SECRET_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/strava_refresh_token
          rm -f /tmp/strava_refresh_token

      - name: Sync weather
        run: python "träning/scripts/sync_weather.py"

      - name: Sync interval performance details
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python "träning/scripts/sync_performance_details.py" --days 60

      - name: Validate performance data
        run: python "träning/scripts/validate_training_data.py"

      - name: Load private Garmin wellness context
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WELLNESS_CONTEXT_FILE: /tmp/training_wellness_context.json
        run: python "träning/scripts/wellness_context.py" --days 28

      - name: AI coach analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          WELLNESS_CONTEXT_FILE: /tmp/training_wellness_context.json
        run: python "träning/scripts/coach.py"

      - name: Remove private wellness context
        if: always()
        run: rm -f /tmp/training_wellness_context.json

      - name: Validate post-coach training data
        run: python "träning/scripts/validate_training_data.py"

      - name: Generate closed week review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python "träning/scripts/weekly_review.py"

      - name: Validate week review contracts
        run: python "träning/scripts/check_week_reviews.py"

      - name: Sync structured swim workouts to Intervals/Garmin
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python "träning/scripts/sync_intervals_swim.py"

      - name: Render and validate training site
        run: python "träning/scripts/render_training_site.py"

      - name: Commit synced data, coach state and live page
        run: |
          TRACKED=(
            "träning/data/activities.json"
            "träning/data/performance_history.json"
            "träning/data/activity_overrides.json"
            "träning/data/coach.json"
            "träning/data/plan.json"
            "träning/data/upcoming_week.json"
            "träning/data/goal.json"
            "träning/data/weather.json"
            "träning/data/dashboard_summary.json"
            "träning/data/week_reviews"
            "träning/data/weeks"
            "träning/vecka"
            "träning/malbild"
            "träning/malbild-2027"
            "träning/index.html"
            "träning/index.manual-backup.html"
          )
          if [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "No repository changes."
          else
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- "${TRACKED[@]}"
            git commit -m "Auto-update training page and AI coach"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Pages step outcomes
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure_pages.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_pages.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "configure_pages_outcome": os.environ.get("CONFIGURE_OUTCOME"),
              "upload_pages_outcome": os.environ.get("UPLOAD_OUTCOME"),
              "deploy_pages_outcome": os.environ.get("DEPLOY_OUTCOME"),
              "page_url": os.environ.get("PAGE_URL"),
              "verification_attempted": False,
              "verification_ok": False,
          }
          Path("träning/data/deployment_verification.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Probe deployed goal page
        id: verify_deploy
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          target="${PAGE_URL%/}/träning/malbild-2027/?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=$(curl -L -sS -o /tmp/deployed-goal.html -D /tmp/deployed-headers.txt -w '%{http_code}' --max-time 30 "$target" || true)
          has_hierarchy=false
          has_mesocycle=false
          access_intercept=false
          if grep -q 'data-goal-hierarchy="true"' /tmp/deployed-goal.html 2>/dev/null; then has_hierarchy=true; fi
          if grep -q 'data-current-mesocycle="true"' /tmp/deployed-goal.html 2>/dev/null; then has_mesocycle=true; fi
          if grep -qi 'Cloudflare Access\|Sign in.*Cloudflare Access' /tmp/deployed-goal.html 2>/dev/null; then access_intercept=true; fi
          if [ "$code" = "200" ] && [ "$has_hierarchy" = "true" ] && [ "$has_mesocycle" = "true" ]; then ok=true; else ok=false; fi
          export TARGET_URL="$target" HTTP_STATUS="$code" HAS_HIERARCHY="$has_hierarchy" HAS_MESOCYCLE="$has_mesocycle" ACCESS_INTERCEPT="$access_intercept" VERIFY_OK="$ok"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("träning/data/deployment_verification.json")
          data = json.loads(path.read_text())
          headers = Path('/tmp/deployed-headers.txt').read_text(errors='replace') if Path('/tmp/deployed-headers.txt').exists() else ''
          body = Path('/tmp/deployed-goal.html').read_text(errors='replace') if Path('/tmp/deployed-goal.html').exists() else ''
          data.update({
              "verification_attempted": True,
              "target_url": os.environ.get("TARGET_URL"),
              "http_status": os.environ.get("HTTP_STATUS"),
              "goal_hierarchy_found": os.environ.get("HAS_HIERARCHY") == "true",
              "current_mesocycle_found": os.environ.get("HAS_MESOCYCLE") == "true",
              "cloudflare_access_intercepted_probe": os.environ.get("ACCESS_INTERCEPT") == "true",
              "verification_ok": os.environ.get("VERIFY_OK") == "true",
              "response_headers": headers[:4000],
              "response_preview": body[:1200],
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Persist deployment diagnostics
        if: always()
        continue-on-error: true
        run: |
          if [ -f "träning/data/deployment_verification.json" ]; then
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "träning/data/deployment_verification.json"
            if ! git diff --cached --quiet; then
              git commit -m "Record training deployment diagnostics"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi

      - name: Validate Pages deployment result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "GitHub Pages deployment step succeeded."
          elif [ "$DEPLOY_OUTCOME" = "failure" ] || [ "$DEPLOY_OUTCOME" = "cancelled" ]; then
            echo "GitHub Pages deployment step outcome: $DEPLOY_OUTCOME"
            exit 1
          else
            echo "GitHub Pages deployment was not attempted because an earlier workflow step failed (outcome: $DEPLOY_OUTCOME)."
            echo "Preserving the original failure as the single actionable error."
            exit 0
          fi

          if [ -f "träning/data/deployment_verification.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("träning/data/deployment_verification.json").read_text())
          if data.get("cloudflare_access_intercepted_probe"):
              print("Unauthenticated live probe intercepted by Cloudflare Access; this is not a Pages deployment failure.")
          elif data.get("verification_ok"):
              print("Live marker verification succeeded.")
          else:
              print("Live probe inconclusive, but Pages deployment itself succeeded.")
          PY
          fi
