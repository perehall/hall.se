name: Update training data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "träning/data/manual-sync-trigger.txt"

concurrency:
  group: training-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backup current live page once
        run: |
          if [ ! -f "träning/index.manual-backup.html" ]; then
            cp "träning/index.html" "träning/index.manual-backup.html"
          fi

      - name: Sync Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: /tmp/strava_refresh_token
        run: python "träning/scripts/sync_strava.py"

      - name: Persist rotated Strava refresh token
        env:
          GH_TOKEN: ${{ secrets.TRAINING_SECRET_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/strava_refresh_token
          rm -f /tmp/strava_refresh_token

      - name: Sync weather
        run: python "träning/scripts/sync_weather.py"

      - name: AI coach analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python "träning/scripts/coach.py"

      - name: Sync structured swim workouts to Intervals/Garmin
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python "träning/scripts/sync_intervals_swim.py"

      - name: Build live page
        run: python "träning/scripts/build.py"

      - name: Finalize and validate dashboard
        run: python "träning/scripts/finalize_dashboard.py"

      - name: Apply dashboard UI labels
        run: python "träning/scripts/finalize_dashboard_ui.py"

      - name: Refine Tränings-Yoda UX
        run: python "träning/scripts/finalize_yoda_ui.py"

      - name: Archive weekly history
        run: python "träning/scripts/archive_weeks.py"

      - name: Build preliminary upcoming week
        run: python "träning/scripts/build_upcoming_week.py"

      - name: Emphasize week period
        run: python "träning/scripts/finalize_header_ui.py"

      - name: Link upcoming days to details
        run: python "träning/scripts/finalize_navigation_ui.py"

      - name: Add sport icons and watch sync status
        run: python "träning/scripts/finalize_sport_icons.py"

      - name: Preserve completed structured workout history
        run: python "träning/scripts/finalize_workout_history.py"

      - name: Build goal page and link from weekly plan
        run: python "träning/scripts/build_home.py"

      - name: Finalize goal link placement
        run: python "träning/scripts/finalize_goal_link_layout.py"

      - name: Commit synced data, coach state and live page
        run: |
          TRACKED=(
            "träning/data/activities.json"
            "träning/data/coach.json"
            "träning/data/plan.json"
            "träning/data/upcoming_week.json"
            "träning/data/goal.json"
            "träning/data/weather.json"
            "träning/data/dashboard_summary.json"
            "träning/data/weeks"
            "träning/vecka"
            "träning/malbild"
            "träning/index.html"
            "träning/index.manual-backup.html"
          )
          if [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "No repository changes."
          else
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- "${TRACKED[@]}"
            git commit -m "Auto-update training page and AI coach"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check deployed goal page
        id: verify_deploy
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          target="${PAGE_URL%/}/träning/malbild/?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=""
          has_component=false
          has_phase2=false
          ok=false
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/deployed-goal.html -D /tmp/deployed-headers.txt -w '%{http_code}' --max-time 30 "$target" || true)
            if grep -q 'mountain-phase-point' /tmp/deployed-goal.html 2>/dev/null; then has_component=true; else has_component=false; fi
            if grep -q 'href="#fas-2"' /tmp/deployed-goal.html 2>/dev/null; then has_phase2=true; else has_phase2=false; fi
            if [ "$code" = "200" ] && [ "$has_component" = "true" ] && [ "$has_phase2" = "true" ]; then
              ok=true
              break
            fi
            sleep 10
          done
          python - <<PY
          import json, os
          from pathlib import Path
          headers = Path('/tmp/deployed-headers.txt').read_text(errors='replace') if Path('/tmp/deployed-headers.txt').exists() else ''
          html = Path('/tmp/deployed-goal.html').read_text(errors='replace') if Path('/tmp/deployed-goal.html').exists() else ''
          data = {
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'page_url': os.environ.get('PAGE_URL'),
              'target_url': ${target@Q},
              'http_status': ${code@Q},
              'interactive_component_found': ${has_component@Q} == 'true',
              'phase_2_anchor_found': ${has_phase2@Q} == 'true',
              'verification_ok': ${ok@Q} == 'true',
              'response_headers': headers[:4000],
              'response_preview': html[:1200],
          }
          Path('träning/data/deployment_verification.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Persist deployment verification
        if: always()
        run: |
          if [ -f "träning/data/deployment_verification.json" ]; then
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "träning/data/deployment_verification.json"
            if ! git diff --cached --quiet; then
              git commit -m "Record training deployment verification"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Fail on stale deployment
        if: steps.verify_deploy.outputs.ok != 'true'
        run: |
          echo "Published goal page did not contain the expected interactive periodization component."
          cat "träning/data/deployment_verification.json" || true
          exit 1
