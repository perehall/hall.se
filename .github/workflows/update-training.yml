name: Update training data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "träning/data/manual-sync-trigger.txt"

concurrency:
  group: training-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backup current live page once
        run: |
          if [ ! -f "träning/index.manual-backup.html" ]; then
            cp "träning/index.html" "träning/index.manual-backup.html"
          fi

      - name: Sync Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: /tmp/strava_refresh_token
        run: python "träning/scripts/sync_strava.py"

      - name: Persist rotated Strava refresh token
        env:
          GH_TOKEN: ${{ secrets.TRAINING_SECRET_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < /tmp/strava_refresh_token
          rm -f /tmp/strava_refresh_token

      - name: Sync weather
        run: python "träning/scripts/sync_weather.py"

      - name: AI coach analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python "träning/scripts/coach.py"

      - name: Sync structured swim workouts to Intervals/Garmin
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python "träning/scripts/sync_intervals_swim.py"

      - name: Build live page
        run: python "träning/scripts/build.py"

      - name: Finalize and validate dashboard
        run: python "träning/scripts/finalize_dashboard.py"

      - name: Apply dashboard UI labels
        run: python "träning/scripts/finalize_dashboard_ui.py"

      - name: Refine Tränings-Yoda UX
        run: python "träning/scripts/finalize_yoda_ui.py"

      - name: Archive weekly history
        run: python "träning/scripts/archive_weeks.py"

      - name: Build preliminary upcoming week
        run: python "träning/scripts/build_upcoming_week.py"

      - name: Emphasize week period
        run: python "träning/scripts/finalize_header_ui.py"

      - name: Link upcoming days to details
        run: python "träning/scripts/finalize_navigation_ui.py"

      - name: Add sport icons and watch sync status
        run: python "träning/scripts/finalize_sport_icons.py"

      - name: Preserve completed structured workout history
        run: python "träning/scripts/finalize_workout_history.py"

      - name: Build goal page and link from weekly plan
        run: python "träning/scripts/build_home.py"

      - name: Finalize goal link placement
        run: python "träning/scripts/finalize_goal_link_layout.py"

      - name: Commit synced data, coach state and live page
        run: |
          TRACKED=(
            "träning/data/activities.json"
            "träning/data/coach.json"
            "träning/data/plan.json"
            "träning/data/upcoming_week.json"
            "träning/data/goal.json"
            "träning/data/weather.json"
            "träning/data/dashboard_summary.json"
            "träning/data/weeks"
            "träning/vecka"
            "träning/malbild"
            "träning/index.html"
            "träning/index.manual-backup.html"
          )
          if [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "No repository changes."
          else
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -- "${TRACKED[@]}"
            git commit -m "Auto-update training page and AI coach"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        id: upload_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record Pages step outcomes
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure_pages.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_pages.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "configure_pages_outcome": os.environ.get("CONFIGURE_OUTCOME"),
              "upload_pages_outcome": os.environ.get("UPLOAD_OUTCOME"),
              "deploy_pages_outcome": os.environ.get("DEPLOY_OUTCOME"),
              "page_url": os.environ.get("PAGE_URL"),
              "verification_attempted": False,
              "verification_ok": False,
          }
          Path("träning/data/deployment_verification.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Check deployed goal page
        id: verify_deploy
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -u
          target="${PAGE_URL%/}/träning/malbild/?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          code=""
          has_component=false
          has_phase2=false
          ok=false
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o /tmp/deployed-goal.html -D /tmp/deployed-headers.txt -w '%{http_code}' --max-time 30 "$target" || true)
            if grep -q 'mountain-phase-point' /tmp/deployed-goal.html 2>/dev/null; then has_component=true; else has_component=false; fi
            if grep -q 'href="#fas-2"' /tmp/deployed-goal.html 2>/dev/null; then has_phase2=true; else has_phase2=false; fi
            if [ "$code" = "200" ] && [ "$has_component" = "true" ] && [ "$has_phase2" = "true" ]; then
              ok=true
              break
            fi
            sleep 10
          done
          export TARGET_URL="$target" HTTP_STATUS="$code" HAS_COMPONENT="$has_component" HAS_PHASE2="$has_phase2" VERIFY_OK="$ok"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("träning/data/deployment_verification.json")
          data = json.loads(path.read_text())
          headers = Path('/tmp/deployed-headers.txt').read_text(errors='replace') if Path('/tmp/deployed-headers.txt').exists() else ''
          body = Path('/tmp/deployed-goal.html').read_text(errors='replace') if Path('/tmp/deployed-goal.html').exists() else ''
          data.update({
              "verification_attempted": True,
              "target_url": os.environ.get("TARGET_URL"),
              "http_status": os.environ.get("HTTP_STATUS"),
              "interactive_component_found": os.environ.get("HAS_COMPONENT") == "true",
              "phase_2_anchor_found": os.environ.get("HAS_PHASE2") == "true",
              "verification_ok": os.environ.get("VERIFY_OK") == "true",
              "response_headers": headers[:4000],
              "response_preview": body[:1200],
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Persist deployment diagnostics
        if: always()
        run: |
          if [ -f "träning/data/deployment_verification.json" ]; then
            git config user.name "training-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "träning/data/deployment_verification.json"
            if ! git diff --cached --quiet; then
              git commit -m "Record training deployment diagnostics"
              git pull --rebase origin main
              git push origin main
            fi
          fi

      - name: Fail on deployment problem
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("träning/data/deployment_verification.json").read_text())
          if data.get("deploy_pages_outcome") != "success":
              raise SystemExit("GitHub Pages deployment step did not succeed")
          if not data.get("verification_ok"):
              raise SystemExit("Published goal page did not contain the expected interactive periodization component")
          print("Pages deployment and live goal-page verification OK")
          PY
