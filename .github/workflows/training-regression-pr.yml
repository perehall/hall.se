name: Training regression PR

on:
  pull_request:
    paths:
      - "träning/**"
      - "supabase/**"
      - ".github/workflows/training-regression-pr.yml"

permissions:
  contents: read

concurrency:
  group: training-regression-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Supabase shadow model against live canonical data
        run: python "träning/scripts/supabase_shadow_model.py"

      - name: Run deterministic training regression suite
        run: python "träning/scripts/run_regression_tests.py"

      - name: Report architecture v2 cutover readiness
        run: PYTHONPATH="träning" python "träning/v2_cutover_readiness.py"

      - name: Install PostgreSQL driver for v2 read-only probe
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Probe architecture v2 directly against canonical PostgreSQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL"
          python "träning/scripts/supabase_activity_backend.py" --mode hydrate
          python "träning/scripts/supabase_runtime_state.py" --scope final --mode hydrate
          PYTHONPATH="träning" python - <<'PY'
          from scripts.render_training_site import run_legacy_parity_pipeline
          run_legacy_parity_pipeline()
          PY
          V2_PROBE_OUTPUT="/tmp/v2-presentation.json" PYTHONPATH="träning" python "träning/v2_presentation_probe.py"
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("/tmp/v2-presentation.json").read_text(encoding="utf-8"))
          semantics=payload["semantics"]
          assert semantics["today"]["date"]
          assert semantics["today"]["title"]
          assert semantics["week"]["start"] <= semantics["today"]["date"] <= semantics["week"]["end"]
          assert semantics["week"]["planned_count"] >= 1
          document=payload["document"]
          assert document.startswith("<!doctype html>")
          assert 'name="viewport"' in document
          assert 'data-v2-goal-link' in document
          assert "Styrkemall" in document and "Om systemet" in document
          print("V2_SHADOW_OK", json.dumps(semantics, ensure_ascii=False, sort_keys=True))
          PY
          PYTHONPATH="träning:träning/scripts" python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          from v2_legacy_parity import compare_cutover_contract, legacy_semantic_contract
          payload=json.loads(Path("/tmp/v2-presentation.json").read_text(encoding="utf-8"))
          today=date.fromisoformat(payload["semantics"]["today"]["date"])
          legacy=legacy_semantic_contract(Path("träning/index.html"), today=today)
          differences=compare_cutover_contract(legacy, payload["semantics"])
          if differences:
              raise SystemExit("V2_PARITY_FAILED\\n" + "\\n".join(differences))
          print("V2_PARITY_OK")
          PY
