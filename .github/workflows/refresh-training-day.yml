name: Refresh training day

on:
  workflow_dispatch:
  schedule:
    # 00:05 Europe/Stockholm. GitHub cron is UTC, so both CET/CEST slots
    # are scheduled; the guard below uses only the slot matching the current offset.
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"

concurrency:
  group: training-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Stockholm midnight slot
        id: midnight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Stockholm"))
          offset_hours = int(now.utcoffset().total_seconds() // 3600)
          expected_schedule = "5 22 * * *" if offset_hours == 2 else "5 23 * * *"
          should_run = (
              os.environ.get("EVENT_NAME") == "workflow_dispatch"
              or os.environ.get("EVENT_SCHEDULE") == expected_schedule
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if should_run else 'false'}\n")

          print(
              f"Stockholm={now.isoformat()} offset={offset_hours:+d} "
              f"schedule={os.environ.get('EVENT_SCHEDULE', '')!r} "
              f"expected={expected_schedule!r} run={should_run}"
          )
          PY

      - name: Advance day rollover trigger
        if: steps.midnight.outputs.run == 'true'
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Europe/Stockholm")).date().isoformat()
          Path("träning/data/day-rollover-trigger.txt").write_text(
              f"{today} Europe/Stockholm\n",
              encoding="utf-8",
          )
          print(f"Day rollover trigger: {today}")
          PY

          if [ -z "$(git status --porcelain -- "träning/data/day-rollover-trigger.txt")" ]; then
            echo "Day already refreshed."
            exit 0
          fi

          git config user.name "training-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "träning/data/day-rollover-trigger.txt"
          git commit -m "Advance training day rollover"
          git pull --rebase --autostash origin main
          git push origin main
