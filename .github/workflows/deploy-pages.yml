name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Canonical training-data writes are published only after update-training
    # has normalized/materialized the full state and explicitly dispatches Pages.
    # Deploying raw intermediate data commits creates false failure notifications; publish only canonical state.
    paths-ignore:
      - "träning/data/**"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression suite
        run: python "träning/scripts/run_regression_tests.py"

      - name: Test Strava webhook worker
        run: |
          node --check "infra/strava-webhook/src/worker.mjs"
          node --test "infra/strava-webhook/test/worker.test.mjs"

      - name: Check generated planning freshness
        id: planning_freshness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "träning/scripts")
          from goal_contracts import planning_goal_hash

          root = Path("träning/data")
          goal = json.loads((root / "goal.json").read_text(encoding="utf-8"))
          strategy = json.loads((root / "training_strategy.json").read_text(encoding="utf-8"))
          digest = planning_goal_hash(goal)
          stale = (
              strategy.get("north_star") != str(goal.get("goal") or "").strip()
              or (strategy.get("goal_contract") or {}).get("goal_hash") != digest
              or (strategy.get("current_mesocycle") or {}).get("goal_basis_hash") != digest
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"stale={'true' if stale else 'false'}\n")
          if stale:
              print(
                  "::notice::Deployment deferred: canonical goal/race contract changed "
                  "and generated planning state has not been regenerated yet."
              )
          else:
              print("Generated planning state matches the canonical goal contract.")
          PY

      - name: Normalize and materialize training data for render
        if: steps.planning_freshness.outputs.stale != 'true'
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py"
          python "träning/scripts/materialize_workout_designs.py"
          python "träning/scripts/validate_workout_designs.py"
          python "träning/scripts/materialize_device_workouts.py"
          python "träning/scripts/validate_device_workouts.py"

      - name: Render and validate training site
        if: steps.planning_freshness.outputs.stale != 'true'
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python "träning/scripts/render_training_site.py"

      - name: Configure GitHub Pages
        if: steps.planning_freshness.outputs.stale != 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.planning_freshness.outputs.stale != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: steps.planning_freshness.outputs.stale != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public training page matches deployed UI
        if: steps.planning_freshness.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://xn--hll-qla.se/tr%C3%A4ning/?deploy=${GITHUB_SHA}"
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          for attempt in $(seq 1 18); do
            : >"$body"
            : >"$headers"
            curl --silent --show-error --max-time 20 \
              -D "$headers" -o "$body" \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${url}&attempt=${attempt}" || true

            if grep -Fqi 'cloudflareaccess.com' "$headers"; then
              echo "::warning::Public custom-domain verification is protected by Cloudflare Access; GitHub Pages deployment itself succeeded."
              exit 0
            fi

            if grep -Fq 'class="top-overview"' "$body" \
              && grep -Fq 'class="top-today"' "$body" \
              && grep -Fq 'class="current-week-header"' "$body"; then
              echo "PUBLIC_TRAINING_PAGE_OK attempt=${attempt}"
              exit 0
            fi

            echo "Public page not updated yet (attempt ${attempt}/18); retrying..."
            sleep 10
          done
          echo "::error::Public training page did not expose the deployed current UI within 3 minutes."
          exit 1

      - name: Defer Pages until adaptive regeneration
        if: steps.planning_freshness.outputs.stale == 'true'
        run: echo "Pages deployment intentionally deferred; update-training will publish the regenerated canonical state."
