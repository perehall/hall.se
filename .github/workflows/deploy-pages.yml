name: Deploy Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "träning/data/manual-sync-trigger.txt"
      - "träning/data/deployment_verification.json"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic regression tests
        run: |
          python -m compileall -q "träning/scripts" "träning/tests"
          python -m unittest discover -s "träning/tests" -p "test_*.py" -v

      - name: Test Strava webhook worker
        run: |
          node --check "infra/strava-webhook/src/worker.mjs"
          node --test "infra/strava-webhook/test/worker.test.mjs"

      - name: Normalize training data for render
        run: |
          python "träning/scripts/migrate_training_data_v3.py"
          python "träning/scripts/normalize_activity_semantics.py"
          python "träning/scripts/validate_training_data.py"

      - name: Render and validate training site
        run: python "träning/scripts/render_training_site.py"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
