name: Configure Strava webhook subscription

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Subscription action"
        required: true
        type: choice
        options:
          - list
          - create
          - delete
      subscription_id:
        description: "Subscription ID (required for delete)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      CALLBACK_ORIGIN: https://hall-se.per-e-hall.workers.dev
    steps:
      - name: Validate inputs and secrets
        env:
          ACTION: ${{ inputs.action }}
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          VERIFY_TOKEN: ${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN }}
          PATH_SECRET: ${{ secrets.STRAVA_WEBHOOK_PATH_SECRET }}
          CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID" || { echo "STRAVA_CLIENT_ID saknas"; exit 1; }
          test -n "$CLIENT_SECRET" || { echo "STRAVA_CLIENT_SECRET saknas"; exit 1; }
          test -n "$VERIFY_TOKEN" || { echo "STRAVA_WEBHOOK_VERIFY_TOKEN saknas"; exit 1; }
          test -n "$PATH_SECRET" || { echo "STRAVA_WEBHOOK_PATH_SECRET saknas"; exit 1; }
          if [ "$ACTION" = "delete" ]; then
            case "$SUBSCRIPTION_ID" in
              ''|*[!0-9]*) echo "subscription_id måste vara ett heltal för delete"; exit 1 ;;
            esac
          fi

      - name: Verify callback challenge
        if: inputs.action == 'create'
        env:
          VERIFY_TOKEN: ${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN }}
          PATH_SECRET: ${{ secrets.STRAVA_WEBHOOK_PATH_SECRET }}
        run: |
          set -euo pipefail
          callback_url="${CALLBACK_ORIGIN}/strava/${PATH_SECRET}"
          challenge="hall-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            --get "$callback_url" \
            --data-urlencode "hub.mode=subscribe" \
            --data-urlencode "hub.challenge=$challenge" \
            --data-urlencode "hub.verify_token=$VERIFY_TOKEN")
          echo "Callback preflight HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Callback preflight failed. Response:"
            cat "$body_file"
            exit 1
          fi
          python - "$challenge" "$body_file" <<'PY'
          import json, sys
          challenge, path = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              data = json.load(fh)
          if data != {"hub.challenge": challenge}:
              raise SystemExit(f"Ogiltigt challenge-svar: {data!r}")
          print("Callback challenge OK.")
          PY

      - name: List subscription
        if: inputs.action == 'list'
        env:
          CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --get \
            https://www.strava.com/api/v3/push_subscriptions \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET"
          echo

      - name: Create subscription
        if: inputs.action == 'create'
        env:
          CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          VERIFY_TOKEN: ${{ secrets.STRAVA_WEBHOOK_VERIFY_TOKEN }}
          PATH_SECRET: ${{ secrets.STRAVA_WEBHOOK_PATH_SECRET }}
        run: |
          set -euo pipefail
          callback_url="${CALLBACK_ORIGIN}/strava/${PATH_SECRET}"
          body_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$body_file" \
            --write-out '%{http_code}' \
            -X POST https://www.strava.com/api/v3/push_subscriptions \
            -F "client_id=$CLIENT_ID" \
            -F "client_secret=$CLIENT_SECRET" \
            -F "callback_url=$callback_url" \
            -F "verify_token=$VERIFY_TOKEN")
          echo "Strava create HTTP $status"
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "Strava create failed. Response:"
            cat "$body_file"
            exit 1
          fi
          subscription_id=$(python - "$body_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          value = data.get("id")
          if not isinstance(value, int):
              raise SystemExit(f"Strava-svaret saknar subscription id: {data!r}")
          print(value)
          PY
          )
          echo "Subscription created: $subscription_id"
          {
            echo "## Strava webhook subscription"
            echo
            echo "Subscription ID: **$subscription_id**"
            echo
            echo "Lägg detta ID som Cloudflare Worker-secret \`STRAVA_SUBSCRIPTION_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete subscription
        if: inputs.action == 'delete'
        env:
          CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X DELETE \
            "https://www.strava.com/api/v3/push_subscriptions/$SUBSCRIPTION_ID?client_id=$CLIENT_ID&client_secret=$CLIENT_SECRET"
          echo "Subscription $SUBSCRIPTION_ID deleted."
